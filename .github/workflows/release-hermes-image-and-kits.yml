name: Release Hermes Image And Kits

on:
  workflow_dispatch:
    inputs:
      hermes_version:
        description: "Hermes Agent version to install in the base image, or latest for newest PyPI release"
        required: true
        default: "latest"
      platforms:
        description: "Docker platforms to build"
        required: true
        default: "linux/amd64,linux/arm64"
      sbx_release:
        description: "docker/sbx-releases tag to install"
        required: true
        default: "v0.32.0"

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install SBX
        env:
          GH_TOKEN: ${{ github.token }}
          SBX_RELEASE: ${{ inputs.sbx_release }}
        run: |
          set -euo pipefail
          gh release download "$SBX_RELEASE" \
            --repo docker/sbx-releases \
            --pattern 'DockerSandboxes-linux-amd64-ubuntu2404.deb' \
            --output /tmp/docker-sandboxes.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/docker-sandboxes.deb
          sbx version

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Hermes base image
        env:
          DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
          HERMES_VERSION: ${{ inputs.hermes_version }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          docker buildx build \
            --push \
            --platform "$PLATFORMS" \
            --build-arg "HERMES_VERSION=$HERMES_VERSION" \
            --tag "docker.io/$DOCKERHUB_NAMESPACE/hermes-agent-sbx:latest" \
            ./hermes

      - name: Publish kit artifacts
        env:
          DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
        run: ./scripts/push-kits.sh
