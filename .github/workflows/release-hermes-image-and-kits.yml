name: Release Hermes Image And Kits

on:
  workflow_dispatch:
    inputs:
      hermes_version:
        description: "Hermes Agent version to install in the base image, or latest for newest PyPI release"
        required: true
        default: "latest"
      platforms:
        description: "Docker platforms to build"
        required: true
        default: "linux/amd64,linux/arm64"
      sbx_release:
        description: "docker/sbx-releases tag to install"
        required: true
        default: "v0.32.0"

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SBX
        env:
          GH_TOKEN: ${{ github.token }}
          SBX_RELEASE: ${{ inputs.sbx_release }}
        run: |
          set -euo pipefail
          gh release download "$SBX_RELEASE" \
            --repo docker/sbx-releases \
            --pattern 'DockerSandboxes-linux-amd64-ubuntu2404.deb' \
            --output /tmp/docker-sandboxes.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/docker-sandboxes.deb
          sbx version

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Hermes base image
        env:
          DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
          HERMES_VERSION: ${{ inputs.hermes_version }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          docker buildx build \
            --push \
            --platform "$PLATFORMS" \
            --build-arg "HERMES_VERSION=$HERMES_VERSION" \
            --tag "docker.io/$DOCKERHUB_NAMESPACE/hermes-agent-sbx:latest" \
            ./hermes

      - name: Publish kit artifacts
        env:
          DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
        run: ./scripts/push-kits.sh
