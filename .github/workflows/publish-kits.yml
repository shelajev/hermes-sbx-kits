name: Publish Kits

on:
  workflow_dispatch:
    inputs:
      kit_version:
        description: "Version tag for kit artifacts"
        required: true
        default: "0.16.0"
      push_latest:
        description: "Also push the latest tag"
        required: true
        type: boolean
        default: true
      sbx_release:
        description: "docker/sbx-releases tag to install"
        required: true
        default: "v0.32.0"

jobs:
  publish-kits:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SBX
        env:
          GH_TOKEN: ${{ github.token }}
          SBX_RELEASE: ${{ inputs.sbx_release }}
        run: |
          set -euo pipefail
          gh release download "$SBX_RELEASE" \
            --repo docker/sbx-releases \
            --pattern 'DockerSandboxes-linux-amd64-ubuntu2404.deb' \
            --output /tmp/docker-sandboxes.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/docker-sandboxes.deb
          sbx version

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish kit artifacts
        env:
          DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
          KIT_VERSION: ${{ inputs.kit_version }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        run: ./scripts/push-kits.sh
