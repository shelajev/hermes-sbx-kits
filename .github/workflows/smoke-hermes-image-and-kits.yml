name: Smoke Hermes Image And Kits

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      hermes_version:
        description: "Hermes Agent version to install, or latest for newest PyPI release"
        required: true
        default: "latest"
      sbx_release:
        description: "docker/sbx-releases tag to install for kit validation"
        required: true
        default: "v0.32.0"

jobs:
  smoke:
    runs-on: ubuntu-24.04
    env:
      HERMES_VERSION: ${{ github.event.inputs.hermes_version || 'latest' }}
      SBX_RELEASE: ${{ github.event.inputs.sbx_release || 'v0.32.0' }}
      IMAGE: local/hermes-agent-sbx:smoke

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image and run Docker smoke tests
        working-directory: ./hermes
        run: ./scripts/test-hermes.sh

      - name: Install SBX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$SBX_RELEASE" \
            --repo docker/sbx-releases \
            --pattern 'DockerSandboxes-linux-amd64-ubuntu2404.deb' \
            --output /tmp/docker-sandboxes.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/docker-sandboxes.deb
          sbx version

      - name: Validate kit manifests
        run: |
          set -euo pipefail
          sbx kit validate ./hermes
          sbx kit validate ./hermes-codex
          sbx kit validate ./hermes-openrouter
          sbx kit validate ./hermes-telegram
